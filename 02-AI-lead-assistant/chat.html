<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Freedom Auto Detailing</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f1115;
            color: white;

            font-family: Arial, sans-serif;
        }

        .chat-container {
            width: 460px;
            height: 680px;

            display: flex;
            flex-direction: column;

            background: #171a20;

            border: 1px solid #2d333d;
            border-radius: 18px;

            overflow: hidden;
        }

        .chat-header {
            padding: 22px;

            background: #1f232b;

            border-bottom: 1px solid #343a45;
        }

        .chat-header h1 {
            margin: 0;

            font-size: 23px;
        }

        .online {
            margin-top: 7px;

            color: #9aa4b4;

            font-size: 14px;
        }

        .online-dot {
            display: inline-block;

            width: 9px;
            height: 9px;

            margin-right: 7px;

            border-radius: 50%;

            background: #27d17f;
        }

        #messages {
            flex: 1;

            padding: 18px;

            overflow-y: auto;

            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;

            margin-bottom: 12px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        .message {
            max-width: 82%;

            padding: 13px 15px;

            border-radius: 15px;

            line-height: 1.4;

            font-size: 16px;

            white-space: pre-wrap;
        }

        .message.user {
            background: #2f6fed;

            color: white;

            border-bottom-right-radius: 5px;
        }

        .message.bot {
            background: #292e38;

            color: white;

            border-bottom-left-radius: 5px;
        }

        /* ==================================
           AVAILABLE TIME BUTTONS
        ================================== */

        .slot-wrapper {
            margin-top: 10px;

            display: flex;
            flex-wrap: wrap;

            gap: 8px;
        }

        .slot-button {
            border: 1px solid #3f7cff;

            background: #161b24;

            color: #82aaff;

            padding: 9px 12px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 14px;

            transition: 0.15s;
        }

        .slot-button:hover {
            background: #2f6fed;

            color: white;

            transform: translateY(-1px);
        }

        .slot-button:disabled {
            opacity: 0.5;

            cursor: default;

            transform: none;
        }

        /* ==================================
           STATUS MESSAGE
        ================================== */

        #status {
            padding: 0 18px 10px;

            color: #8290a6;

            font-size: 12px;
        }

        /* ==================================
           INPUT AREA
        ================================== */

        .input-area {
            display: flex;

            gap: 8px;

            padding: 15px;

            border-top: 1px solid #343a45;

            background: #1f232b;
        }

        #messageInput {
            flex: 1;

            min-width: 0;

            padding: 12px 14px;

            background: #101318;

            border: 1px solid #3b4452;

            border-radius: 10px;

            outline: none;

            color: white;

            font-size: 14px;
        }

        #messageInput:focus {
            border-color: #2f6fed;
        }

        #sendButton {
            padding: 0 20px;

            border: none;
            border-radius: 10px;

            background: #2f6fed;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        #sendButton:hover {
            background: #3d7cff;
        }

        #sendButton:disabled {
            opacity: 0.6;

            cursor: default;
        }

        .footer {
            padding: 0 15px 10px;

            background: #1f232b;

            color: #718099;

            text-align: center;

            font-size: 11px;
        }

        @media (max-width: 520px) {

            body {
                align-items: stretch;
            }

            .chat-container {
                width: 100%;
                height: 100vh;

                border-radius: 0;
                border: none;
            }
        }

    </style>
</head>


<body>

    <div class="chat-container">

        <div class="chat-header">

            <h1>
                Freedom Auto Detailing
            </h1>

            <div class="online">

                <span class="online-dot"></span>

                AI Assistant Online

            </div>

        </div>


        <div id="messages">

            <div class="message-row bot">

                <div class="message bot">
Hey! 👋 Welcome to Freedom Auto Detailing. How can I help with your vehicle today?
                </div>

            </div>

        </div>


        <div id="status"></div>


        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Ask about detailing..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="button"
            >
                Send
            </button>

        </div>


        <div class="footer">
            AI assistant • Appointment requests require confirmation
        </div>

    </div>


    <script>

        // ==================================
        // SESSION
        // ==================================

        let sessionId =
            sessionStorage.getItem(
                "freedom_session_id"
            );


        if (!sessionId) {

            sessionId =
                crypto.randomUUID();

            sessionStorage.setItem(
                "freedom_session_id",
                sessionId
            );

        }


        const messages =
            document.getElementById(
                "messages"
            );


        const input =
            document.getElementById(
                "messageInput"
            );


        const sendButton =
            document.getElementById(
                "sendButton"
            );


        const statusBox =
            document.getElementById(
                "status"
            );


        // ==================================
        // ADD MESSAGE
        // ==================================

        function addMessage(
            text,
            sender
        ) {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " + sender;


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message " + sender;


            bubble.textContent =
                text;


            row.appendChild(
                bubble
            );


            messages.appendChild(
                row
            );


            scrollToBottom();


            return bubble;

        }


        // ==================================
        // SCROLL
        // ==================================

        function scrollToBottom() {

            messages.scrollTop =
                messages.scrollHeight;

        }


        // ==================================
        // EXTRACT AVAILABLE TIMES
        // ==================================

        function extractAvailableSlots(
            responseText
        ) {

            const marker =
                "The next available times are:";


            if (
                !responseText.includes(
                    marker
                )
            ) {

                return [];

            }


            const section =
                responseText
                    .split(marker)[1];


            if (!section) {

                return [];

            }


            const cleaned =
                section
                    .trim()
                    .replace(/\.$/, "");


            const parts =
                cleaned.split(",");


            const slots = [];


            /*
                Backend currently returns:

                Wednesday, September 02 at 9:00 AM,
                Wednesday, September 02 at 9:30 AM,
                Wednesday, September 02 at 10:00 AM

                Splitting by comma creates 6 pieces,
                so we rebuild them in pairs.
            */


            for (
                let i = 0;
                i < parts.length - 1;
                i += 2
            ) {

                const day =
                    parts[i]
                        .trim();


                const dateAndTime =
                    parts[i + 1]
                        .trim();


                if (
                    day &&
                    dateAndTime
                ) {

                    slots.push(
                        day +
                        ", " +
                        dateAndTime
                    );

                }

            }


            return slots;

        }


        // ==================================
        // CREATE SLOT BUTTONS
        // ==================================

        function showSlotButtons(
            slots
        ) {

            if (
                !slots ||
                slots.length === 0
            ) {

                return;

            }


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row bot";


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "slot-wrapper";


            slots.forEach(
                function(slot) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "slot-button";


                    /*
                        Display only the time on
                        the button when possible.
                    */

                    const atIndex =
                        slot.lastIndexOf(
                            " at "
                        );


                    if (
                        atIndex !== -1
                    ) {

                        button.textContent =
                            slot.substring(
                                atIndex + 4
                            );

                    } else {

                        button.textContent =
                            slot;

                    }


                    button.title =
                        slot;


                    button.addEventListener(
                        "click",
                        function() {

                            /*
                                Disable all buttons
                                from this suggestion.
                            */

                            const buttons =
                                wrapper.querySelectorAll(
                                    ".slot-button"
                                );


                            buttons.forEach(
                                function(item) {

                                    item.disabled =
                                        true;

                                }
                            );


                            sendMessage(
                                "Book me for " +
                                slot +
                                "."
                            );

                        }
                    );


                    wrapper.appendChild(
                        button
                    );

                }
            );


            row.appendChild(
                wrapper
            );


            messages.appendChild(
                row
            );


            scrollToBottom();

        }


        // ==================================
        // STATUS
        // ==================================

        function showStatus(
            data
        ) {

            if (
                data.booking_status
                === "booked"
            ) {

                statusBox.textContent =
                    "✓ Appointment booked.";

                return;

            }


            if (
                data.booking_status
                === "unavailable"
            ) {

                statusBox.textContent =
                    "Requested time unavailable.";

                return;

            }


            if (
                data.lead_status
                === "saved"
            ) {

                statusBox.textContent =
                    "✓ Customer information saved.";

                return;

            }


            if (
                data.lead_status
                === "updated"
            ) {

                statusBox.textContent =
                    "Customer information updated.";

                return;

            }


            statusBox.textContent =
                "";

        }


        // ==================================
        // SEND MESSAGE
        // ==================================

        async function sendMessage(
            customMessage = null
        ) {

            const text =
                customMessage !== null
                    ? customMessage
                    : input.value.trim();


            if (!text) {

                return;

            }


            addMessage(
                text,
                "user"
            );


            input.value =
                "";


            input.disabled =
                true;


            sendButton.disabled =
                true;


            statusBox.textContent =
                "Assistant is typing...";


            try {

                const response =
                    await fetch(
                        "/message",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    message:
                                        text,

                                    session_id:
                                        sessionId
                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Server error"
                    );

                }


                const botResponse =
                    data.response ||
                    "I couldn't process that request.";


                addMessage(
                    botResponse,
                    "bot"
                );


                showStatus(
                    data
                );


                const slots =
                    extractAvailableSlots(
                        botResponse
                    );


                if (
                    slots.length > 0
                ) {

                    showSlotButtons(
                        slots
                    );

                }

            }

            catch (error) {

                console.error(
                    error
                );


                addMessage(
                    "I'm having trouble connecting right now. Please try again.",
                    "bot"
                );


                statusBox.textContent =
                    "Connection error.";

            }

            finally {

                input.disabled =
                    false;


                sendButton.disabled =
                    false;


                input.focus();

            }

        }


        // ==================================
        // BUTTON
        // ==================================

        sendButton.addEventListener(
            "click",
            function() {

                sendMessage();

            }
        );


        // ==================================
        // ENTER KEY
        // ==================================

        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        input.focus();

    </script>

</body>

</html>
