<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Freedom Auto Detailing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0d10;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 460px;
            height: 720px;
            max-height: 90vh;
            background: #15181d;
            border: 1px solid #2a2f37;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .header {
            padding: 20px;
            background: #1d2128;
            border-bottom: 1px solid #2a2f37;
        }

        .business-name {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            margin-top: 5px;
            font-size: 13px;
            color: #9ca3af;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 5px;
        }

        .messages {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
        }

        .message {
            max-width: 82%;
            padding: 11px 14px;
            margin-bottom: 12px;
            border-radius: 14px;
            line-height: 1.4;
            font-size: 15px;
            word-wrap: break-word;
        }

        .bot {
            background: #252a32;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .customer {
            background: #2563eb;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .typing {
            color: #9ca3af;
            font-style: italic;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 14px;
            background: #1d2128;
            border-top: 1px solid #2a2f37;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            border: 1px solid #343a44;
            background: #101216;
            color: white;
            padding: 13px;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #2563eb;
        }

        #messageInput::placeholder {
            color: #777f8c;
        }

        #sendButton {
            border: none;
            padding: 0 18px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1d4ed8;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #6b7280;
            padding: 8px;
            background: #1d2128;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-container {
                max-width: none;
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <div class="business-name">
            Freedom Auto Detailing
        </div>

        <div class="status">
            <span class="status-dot"></span>
            AI Assistant Online
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="message bot">
            Hey! 👋 Welcome to Freedom Auto Detailing. How can I help with your vehicle today?
        </div>
    </div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Ask about detailing..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

    <div class="footer">
        AI assistant • Appointment requests require confirmation
    </div>

</div>


<script>

    // =====================================
    // CONVERSATION ID
    // =====================================

    let conversationId =
        localStorage.getItem("conversation_id");

    if (!conversationId) {

        conversationId =
            "customer-" + crypto.randomUUID();

        localStorage.setItem(
            "conversation_id",
            conversationId
        );
    }


    // =====================================
    // PAGE ELEMENTS
    // =====================================

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const messages =
        document.getElementById("messages");


    // =====================================
    // ADD MESSAGE
    // =====================================

    function addMessage(text, sender) {

        const message =
            document.createElement("div");

        message.classList.add(
            "message",
            sender
        );

        message.textContent = text;

        messages.appendChild(message);

        messages.scrollTop =
            messages.scrollHeight;

        return message;
    }


    // =====================================
    // SEND MESSAGE
    // =====================================

    async function sendMessage() {

        const text =
            input.value.trim();

        if (!text) {
            return;
        }

        addMessage(
            text,
            "customer"
        );

        input.value = "";

        input.disabled = true;
        sendButton.disabled = true;


        // =====================================
        // TYPING INDICATOR
        // =====================================

        const typing =
            addMessage(
                "Assistant is typing...",
                "bot"
            );

        typing.classList.add("typing");


        try {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            conversation_id:
                                conversationId,

                            message:
                                text
                        })
                    }
                );


            if (!response.ok) {
                throw new Error(
                    "Server returned an error."
                );
            }


            const data =
                await response.json();


            typing.remove();


            if (data.reply) {

                addMessage(
                    data.reply,
                    "bot"
                );

            } else {

                addMessage(
                    "Sorry, I couldn't process that message. Please try again.",
                    "bot"
                );
            }

        }

        catch (error) {

            typing.remove();

            console.error(error);

            addMessage(
                "I'm having trouble connecting right now. Please try again.",
                "bot"
            );
        }


        // =====================================
        // RE-ENABLE INPUT
        // =====================================

        input.disabled = false;
        sendButton.disabled = false;

        input.focus();
    }


    // =====================================
    // ENTER TO SEND
    // =====================================

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
                && !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );

</script>

</body>
</html>
